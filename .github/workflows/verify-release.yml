name: Verify and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -c requirements.lock -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check jarvis tests scripts main.py
      - run: mypy jarvis
      - run: pytest --cov=jarvis --cov-report=term-missing -q
      - run: node --test tests/test_voice.mjs
      - run: python scripts/security_scan.py
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
      - run: python -m build
      - name: Install and launch the actual wheel
        shell: bash
        run: |
          python -m pip uninstall -y jarvis-ai-runtime
          python -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/scripts/smoke_package.py"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -c requirements.lock -e ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-browser-verification
          path: test-results/
          if-no-files-found: ignore
  package:
    needs: [verify, browser]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -c requirements.lock . build pyinstaller
      - run: python -m build
      - run: python scripts/build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
  release:
    needs: [package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Publish only fully verified artifacts at this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version already published; immutable release left unchanged."
            exit 0
          fi
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --prerelease --title "JARVIS AI ${TAG} — Engineering Preview" --notes-file docs/release-notes.md
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release view "$TAG" --json url,tagName,assets
